{% extends "base.html" %}
{% block title %}Map Of {{title}}{% endblock %}

{% block content %}
  <h1 class="text-2xl font-bold text-center mb-6">Basic Map Of {{title}}</h1>

  <div class="flex justify-center">
    <div class="w-[1200px] h-[600px] bg-gray-100 rounded-xl shadow-lg p-2 overflow-hidden">
      <div id="map-container" class="w-full h-full">
        {{ map|safe }}
      </div>
    </div>
  </div>
{% endblock %}
