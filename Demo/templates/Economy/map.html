{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block head %}
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <style>
    /* Kart içindeki map alanı tam dolsun */
    #map { width: 100%; height: 100%; }
  </style>
{% endblock %}

{% block content %}
  <!-- Başlık (tıpa tıp istediğin gibi) -->
  <h1 class="text-3xl font-bold text-center mb-6">{{ title }}</h1>

  <!-- Kart: 1200x600, beyaz, gölgeli -->
  <div class="flex justify-center">
    <div class="w-[1200px] h-[600px] !bg-white rounded-xl shadow-lg p-2 overflow-hidden">
      <div id="map" class="w-full h-full"></div>
    </div>
  </div>
  <br>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <script>
    const statesData = {{ statesData|safe }};

    const map = L.map('map').setView([39, 35], 5);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    if (statesData) {
      function getVal(props) {
        return props.value ?? props.density ?? props.Density ?? 0;
      }
      function getColor(d) {
        return d > 1000 ? '#800026' :
               d > 500  ? '#BD0026' :
               d > 200  ? '#E31A1C' :
               d > 100  ? '#FC4E2A' :
               d > 50   ? '#FD8D3C' :
               d > 20   ? '#FEB24C' :
               d > 10   ? '#FED976' :
                          '#FFEDA0';
      }
      function style(feature) {
        return {
          fillColor: getColor(getVal(feature.properties||{})),
          weight: 1, opacity: 1, color: 'white', dashArray: '3',
          fillOpacity: 0.7
        };
      }
      const layer = L.geoJson(statesData, { style }).addTo(map);
      try { map.fitBounds(layer.getBounds()); } catch (e) {}
    }

    // İlk boyut sapmasını önlemek için
    setTimeout(() => map.invalidateSize(), 0);
  </script>
{% endblock %}
